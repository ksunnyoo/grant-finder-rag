[project]
name = "grant-finder-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ksunnyoo", email = "sunkbrigita@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
]

[project.scripts]
grant-finder-rag = "grant_finder_rag:main"

[build-system]
